<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Utkarsh Scientific Calculator</title>

  <link rel="stylesheet" href="style.css">

  <!-- Math.js -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@14.0.1/lib/browser/math.js"></script>
</head>

<body>

  <main class="calculator">

    <header class="brand">
      <h1>Utkarsh Calculator</h1>
      <span>Scientific Calculator</span>
    </header>

    <section class="display">

      <div id="expression">0</div>

      <div id="result">0</div>

    </section>

    <section class="control-row">

      <button onclick="toggleAngle()" id="angleBtn">
        DEG
      </button>

      <button onclick="toggleInverse()" id="inverseBtn">
        INV
      </button>

      <button onclick="clearHistory()">
        Clear History
      </button>

    </section>

    <section class="buttons">

      <!-- Scientific -->

      <button onclick="scientific('sin(')">sin</button>
      <button onclick="scientific('cos(')">cos</button>
      <button onclick="scientific('tan(')">tan</button>
      <button onclick="scientific('log10(')">log</button>
      <button onclick="scientific('log(')">ln</button>

      <button onclick="scientific('asin(')">sin⁻¹</button>
      <button onclick="scientific('acos(')">cos⁻¹</button>
      <button onclick="scientific('atan(')">tan⁻¹</button>
      <button onclick="scientific('sqrt(')">√</button>
      <button onclick="scientific('cbrt(')">∛</button>

      <button onclick="scientific('^2')">x²</button>
      <button onclick="scientific('^3')">x³</button>
      <button onclick="scientific('^')">xʸ</button>
      <button onclick="scientific('10^')">10ˣ</button>
      <button onclick="scientific('exp(')">eˣ</button>

      <button onclick="scientific('factorial(')">n!</button>
      <button onclick="scientific('abs(')">|x|</button>
      <button onclick="scientific('pi')">π</button>
      <button onclick="scientific('e')">e</button>
      <button onclick="scientific('ans')">ANS</button>

      <!-- Brackets / Functions -->

      <button onclick="scientific('(')">(</button>
      <button onclick="scientific(')')">)</button>
      <button onclick="scientific(',')">,</button>
      <button onclick="scientific('%')">%</button>
      <button onclick="backspace()">⌫</button>

      <!-- Numbers -->

      <button onclick="scientific('7')">7</button>
      <button onclick="scientific('8')">8</button>
      <button onclick="scientific('9')">9</button>
      <button class="operator" onclick="scientific('÷')">÷</button>
      <button class="operator" onclick="scientific('×')">×</button>

      <button onclick="scientific('4')">4</button>
      <button onclick="scientific('5')">5</button>
      <button onclick="scientific('6')">6</button>
      <button class="operator" onclick="scientific('-')">−</button>
      <button class="operator" onclick="scientific('+')">+</button>

      <button onclick="scientific('1')">1</button>
      <button onclick="scientific('2')">2</button>
      <button onclick="scientific('3')">3</button>
      <button onclick="scientific('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>

      <button class="zero" onclick="scientific('0')">0</button>
      <button onclick="scientific('00')">00</button>
      <button onclick="scientific('EXP')">EXP</button>
      <button class="danger" onclick="clearCalculator()">AC</button>

    </section>

    <section class="history">

      <h2>History</h2>

      <div id="historyList"></div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
